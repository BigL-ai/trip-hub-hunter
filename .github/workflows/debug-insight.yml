# TEMPORAL: diagnóstico del price insight desde los servidores de GitHub. Borrar después.
name: debug-insight
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import json
          from fli.models import *
          from fli.search import SearchFlights
          from fli.search._urls import with_locale_params
          from fli.search.flights import parse_first_wrb_payload
          A = Airport
          seg = FlightSegment(departure_airport=[[A["EZE"],0],[A["AEP"],0]], arrival_airport=[[A["IAD"],0],[A["DCA"],0],[A["BWI"],0]], travel_date="2027-03-04")
          f = FlightSearchFilters(trip_type=TripType.ONE_WAY, passenger_info=PassengerInfo(adults=1), flight_segments=[seg], stops=MaxStops.ONE_STOP_OR_FEWER, sort_by=SortBy.BEST)
          s = SearchFlights()
          for lang, country in [("en","AR"), (None,"AR"), ("en",None), (None,None), ("es-419","AR")]:
              r = s.client.post(url=with_locale_params(s.BASE_URL, "USD", lang, country), data=f"f.req={f.encode()}", impersonate="chrome")
              inner = parse_first_wrb_payload(r.text)
              pi = inner[5] if inner else "PARSE=None"
              print(f"lang={lang} country={country} status={r.status_code} len={len(r.text)} | inner[5]={json.dumps(pi)[:220]}")
              if inner is None: print("   body:", r.text[:200].replace("\n"," "))
          PY
