# TEMPORAL: ¿el insight falla por sesión "gastada"? Borrar después.
name: debug-insight
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import json, yaml
          from curl_cffi import requests as cr
          from fli.models import *
          from fli.search import SearchFlights
          from fli.search._urls import with_locale_params
          from fli.search.flights import parse_first_wrb_payload
          from hunter.source import Source
          cfg = yaml.safe_load(open("config.yaml", encoding="utf-8"))
          src = Source(cfg); t = cfg["trip"]
          A = Airport
          seg = FlightSegment(departure_airport=[[A["EZE"],0],[A["AEP"],0]], arrival_airport=[[A["IAD"],0],[A["DCA"],0],[A["BWI"],0]], travel_date="2027-03-01")
          f = FlightSearchFilters(trip_type=TripType.ONE_WAY, passenger_info=PassengerInfo(adults=1), flight_segments=[seg], stops=MaxStops.ONE_STOP_OR_FEWER, sort_by=SortBy.BEST)
          url = with_locale_params(SearchFlights.BASE_URL, "USD", "es-419", "AR")
          def probe(tag, post):
              r = post(url=url, data=f"f.req={f.encode()}", impersonate="chrome")
              inner = parse_first_wrb_payload(r.text)
              ok = bool(inner and inner[5])
              print(f"{tag}: {'OK' if ok else 'FALLA'} len={len(r.text)}", "" if ok else r.text[:160].replace("\n"," "))
          probe("sesión compartida, 0 búsquedas", src.flights.client.post)
          for d in ["2027-03-0%d" % i for i in range(1, 9)] * 5:
              src.one_way(["MIA"], ["IAD"], d)
              src._cache.clear()
          print("búsquedas hechas:", src.calls)
          import logging, time; logging.basicConfig(level=logging.WARNING)
          t0 = time.time()
          i = src.price_insight(t["origin"], t["destination"], "2027-03-01")
          print(f"price_insight tras ráfaga: {'OK' if i else 'FALLA'} en {time.time()-t0:.0f}s", i and (i["current"], i["level"], len(i["history"])))
          PY
