# Corre el hunter 1 vez por día en los servidores de GitHub (gratis)
# y commitea los resultados → el dashboard (GitHub Pages) se actualiza solo.
name: daily-hunt

on:
  schedule:
    - cron: "0 11 * * *"     # 11:00 UTC = 08:00 Argentina
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write             # necesario para commitear docs/data/*.json

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m hunter.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit resultados
        if: always()
        run: |
          git config user.name "hub-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "hunt: $(date -u +%F)"
          git pull --rebase --autostash
          git push
